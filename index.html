<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lumi Beauty Studio</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            Lumi Beauty
        </div>

        <nav>

            <a href="#inicio">Início</a>
            <a href="#servicos">Serviços</a>
            <a href="#sobre">Sobre</a>
            <a href="#contato">Contato</a>

        </nav>

    </header>


    <main id="inicio">

        <section class="hero">

            <div class="hero-text">

                <p class="subtitulo">
                    BELEZA & CUIDADO
                </p>

                <h1>
                    Sua beleza,
                    <span>seu momento.</span>
                </h1>

                <p>
                    Um espaço criado para você relaxar,
                    cuidar de si e se sentir ainda mais bonita.
                </p>

                <button>
                    Agendar horário
                </button>

            </div>


            <div class="hero-image">

                <!-- nossa imagem vai entrar aqui -->

            </div>

        </section>


        <section id="servicos">

            <h2>
                Nossos serviços
            </h2>

        </section>


        <section id="sobre">

            <h2>
                Sobre a Lumi
            </h2>

        </section>


        <section id="contato">

            <h2>
                Entre em contato
            </h2>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
